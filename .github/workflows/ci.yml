name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DejaVu Sans Mono font (glyph atlas source on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install package (with test extra)
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q tests/test_render.py tests/test_verify.py tests/test_anneal.py
